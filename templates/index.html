<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>

<body>

<div class="container">

    <header class="header">
        <h1>EduGenie</h1>
        <p>Google Gemini Powered Learning Assistant</p>
    </header>


    <main class="card">

        <h2>Learning Assistant</h2>

        <!-- Feature Selection -->
        <label for="feature">Choose Feature</label>

        <select id="feature">
            <option value="qa">Q&A</option>
            <option value="explain">Explain</option>
            <option value="quiz">Quiz</option>
            <option value="summarize">Summary</option>
            <option value="learning_path">Recommend Learning Path</option>
        </select>


        <!-- Main Input -->
        <label id="inputLabel" for="inputText">
            Enter your question or topic
        </label>

        <textarea
            id="inputText"
            rows="7"
            placeholder="Example: What is Python?"
        ></textarea>


        <!-- Quiz Options -->
        <div id="quizOptions" class="hidden">

            <label for="numberQuestions">
                Number of Questions
            </label>

            <input
                type="number"
                id="numberQuestions"
                value="5"
                min="1"
                max="20"
            >

        </div>


        <!-- Learning Path Options -->
        <div id="learningOptions" class="hidden">

            <label for="level">
                Student Level
            </label>

            <select id="level">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>


            <label for="goal">
                Learning Goal
            </label>

            <input
                type="text"
                id="goal"
                placeholder="Example: Learn the basics"
            >

        </div>


        <!-- Generate Button -->
        <button id="generateBtn">
            Generate
        </button>


        <!-- Loading -->
        <div id="loading" class="hidden">
            Generating response...
        </div>


        <!-- Result -->
        <section class="result-section">

            <h2>Result</h2>

            <div id="result">
                Your result will appear here.
            </div>

        </section>

    </main>


    <footer>
        EduGenie © 2026
    </footer>

</div>


<script src="{{ url_for('static', path='app.js') }}"></script>

</body>
</html>
